plugins {
    id "com.android.application"
}

def localConfig = new Properties()
def localConfigFile = rootProject.file("local.properties")
if (localConfigFile.exists()) {
    localConfigFile.withInputStream { localConfig.load(it) }
}
def configuredDefaultSn = localConfig.getProperty("c1.defaultSn", "").trim().toUpperCase()
if (!(configuredDefaultSn ==~ /CC[A-Z0-9]{14}/)) {
    configuredDefaultSn = ""
}

android {
    namespace "dev.c1bridge.app"
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "dev.c1bridge.app"
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName "0.8.5"
        buildConfigField "String", "C1_DEFAULT_SN", "\"${configuredDefaultSn}\""
    }
}

dependencies {
    def cameraxVersion = "1.3.4"

    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "androidx.activity:activity:1.8.2"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    testImplementation "junit:junit:4.13.2"
}
